name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Migration self-test
        run: cargo run --release --bin selftest_migrate

      - name: Check UI file is not empty / guardrails
        shell: pwsh
        run: |
          $ui = Get-Item src\ui\index.html
          if ($ui.Length -lt 50000) { throw "UI 文件异常偏小：$($ui.Length) 字节" }
          Write-Host ("UI: " + $ui.Length + " 字节")
