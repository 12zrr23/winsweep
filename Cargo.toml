[package]
name = "winsweep"
version = "0.1.0"
edition = "2024"
authors = ["WinSweep Team"]
description = "Deep clean, optimize, analyze disk, and monitor your Windows PC in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
walkdir = "2.5"
trash = "5.2"
chrono = "0.4"
colored = "2.2"
tiny_http = "0.12.0"
